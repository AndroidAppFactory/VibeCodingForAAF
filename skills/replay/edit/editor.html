<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZixieKit Replay Event 编排器</title>
<link rel="stylesheet" href="css/editor.css?v=7e16358e">
</head>
<body>

<div class="app">
  <!-- 左侧：手机模拟和重放控制 -->
  <div class="left-panel">
    <!-- 重放控制（手机上方） -->
    <div class="section replay-section">
      <div class="replay-controls-compact">
        <button id="btn-play" onclick="toggleReplay()" class="control-btn primary">▶️ 重放</button>
        <div class="control-row">
          <label>间隔</label>
          <input id="replay-delay" type="number" value="500" min="0" max="10000" step="100">
          <span>ms</span>
        </div>
        <div class="phone-zoom-controls">
          <button onclick="zoomOut()" class="zoom-btn">🔍−</button>
          <span id="zoom-level">100%</span>
          <button onclick="zoomIn()" class="zoom-btn">🔍+</button>
        </div>
      </div>
    </div>

    <!-- 手机预览 -->
    <div class="section phone-section">
      <!-- 截屏前/后切换 + 旋转 -->
      <div class="screenshot-switch" id="screenshot-switch" style="margin-bottom:8px">
        <button id="btn-ss-before" class="ss-btn active" onclick="showScreenshotBefore()">◀ 前</button>
        <span id="screenshot-label">截屏</span>
        <button id="btn-ss-after" class="ss-btn" onclick="showScreenshotAfter()">后 ▶</button>
        <button id="btn-ss-rotate" class="ss-btn" onclick="rotateScreenshot()" title="旋转截图（每次顺时针 90°）">⟳</button>
      </div>
      <!-- 分辨率/设备切换（flow edit 模式下可见） -->
      <div class="profile-switch" id="profile-switch" style="display:none;margin-bottom:8px">
        <select id="profile-select" onchange="switchResolution(this.value)" style="padding:4px 8px;border:1px solid #444;border-radius:4px;background:#1a1a2e;color:#eee;font-size:14px;width:100%"></select>
        <button onclick="addProfile()" style="margin-top:4px;padding:2px 12px;border:1px dashed #555;border-radius:4px;background:transparent;color:#888;font-size:12px;cursor:pointer;width:100%">+ 添加分辨率</button>
      </div>
      <div class="phone-frame" id="phone-frame">
        <div class="phone-screen" id="phone-screen"></div>
        <canvas class="phone-canvas" id="phone-canvas"></canvas>
        <div class="phone-overlay" id="phone-overlay"></div>
      </div>
    </div>
  </div>
  <div class="resizer" id="resizer-left" title="拖拽调整宽度"></div>

  <!-- 中间：事件列表 -->
  <div class="center-panel">
    <div class="section">
      <div class="panel-header">
        <h2 id="panel-title">📋 事件列表</h2>
        <button id="btn-filter-critical" onclick="toggleCriticalFilter()" class="tool-btn" title="仅显示关键事件" style="font-size: 15px;padding: 2px 12px;margin-left: 5px">⭐ 筛选关键</button>
        <span class="stats" id="stats">0 个事件</span>
      </div>
      <div class="event-list" id="event-list">
        <div class="empty-state">
          <div class="icon">📱</div>
          <p>正在加载录制文件...</p>
        </div>
      </div>
    </div>
  </div>
  <div class="resizer" id="resizer-right" title="拖拽调整宽度"></div>

  <!-- 右侧：工具和编辑 -->
  <div class="right-panel">
      <div class="section">
      <h3>🔧 常用工具</h3>
      <div class="toolbar">
        <button onclick="showAddModal()" class="tool-btn">＋ 添加事件</button>
        <button onclick="saveFile()" class="tool-btn primary">💾 保存</button>
        <button onclick="saveFileAs()" class="tool-btn">📋 另存为</button>
      </div>
      <div class="toolbar">
        <button onclick="exportAsJson()" class="tool-btn">📄 导出 JSON</button>
        <button onclick="exportAsScript()" class="tool-btn">📜 导出脚本</button>
      </div>
      <div class="toolbar">
        <button onclick="showFavoritesModal()" class="tool-btn">📂 引用Flow</button>
        <button onclick="saveToFavorites()" class="tool-btn">⭐ 保存为Flow</button>
      </div>
    </div>

    <div class="section">
      <h3>⚙️ 批量操作</h3>
      <div class="toolbar">
        <button onclick="clearSelection()" class="tool-btn">✕ 取消选择</button>
        <button onclick="deleteSelected()" class="tool-btn">🗑️ 删除选中</button>
        <button onclick="duplicateSelected()" class="tool-btn">📋 批量复制</button>
      </div>
      <p class="hint">💡 Ctrl/Cmd+点击多选，Shift+点击范围选</p>
    </div>

    <div class="section edit-section">
      <h3>✏️ 事件编辑</h3>
      <div class="edit-panel" id="edit-panel" style="display:none">
        <h4>编辑事件 #<span id="edit-index">0</span></h4>
        <div id="edit-fields"></div>
      </div>
      <div class="edit-empty" id="edit-empty">
        <p>👈 点击左侧事件列表中的事件进行编辑</p>
      </div>
    </div>
  </div>
</div>

<!-- 添加事件模态框 -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3>添加事件</h3>
    <div class="form-group" id="add-name-group">
      <label>名称（可选）</label>
      <input type="text" id="add-name" value="" placeholder="如：点击登录按钮">
    </div>
    <div class="form-group">
      <label>类型</label>
      <select id="add-type" onchange="updateAddForm()"></select>
    </div>
    <div id="add-fields"></div>
    <div class="form-group" id="add-delay-group">
      <label>前延迟 (ms) — 执行前等待</label>
      <input type="number" id="add-delay-before" value="5000" min="0" step="100">
      <label style="margin-top: 5px">后延迟 (ms) — 执行后等待</label>
<input type="number" id="add-delay-after" value="5000" min="0" step="100">
      <div style="margin-top: 5px;display:flex;align-items:center;gap: 6px">
        <span style="font-size: 20px;color:#b0bec5;font-weight:500">关键事件</span>
        <label class="critical-switch">
          <input type="checkbox" id="add-is-critical">
          <span class="critical-slider"></span>
        </label>
      </div>
      <label style="margin-top: 5px">采集模式</label>
      <select id="add-capture-mode" style="padding: 2px 8px;border:1px solid #444;border-radius: 4px;background:#1a1a2e;color:#eee;font-size: 18px">
        <option value="screenshot">截屏</option>
        <option value="video">录屏</option>
        <option value="none">跳过采集</option>
      </select>
    </div>
    <div class="btn-row">
      <button onclick="closeAddModal()">取消</button>
      <button class="primary" onclick="confirmAdd()">添加</button>
    </div>
  </div>
</div>

<!-- 添加分辨率 Profile 模态框 -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <h3>添加分辨率</h3>
    <div class="form-group" style="background:#0d1117;padding:8px 10px;border-radius:4px">
      <span style="color:#8b949e;font-size:13px">📋 终端执行下方命令，粘贴输出：</span>
      <code style="display:block;margin-top:4px;padding:6px 10px;background:#161b22;border-radius:3px;color:#7ee787;font-size:13px;user-select:all;cursor:pointer" id="cmd-get-device" title="点击复制">adb shell 'echo "$(getprop ro.product.model) $(wm size)"'</code>
    </div>
    <div class="form-group">
      <input type="text" id="profile-paste" value="" placeholder="粘贴输出，如 Pixel 6 Physical size: 1080x2400" oninput="parseProfilePaste()" style="font-family:monospace;font-size:14px">
    </div>
    <div class="form-group" id="profile-preview" style="display:none;text-align:center;color:#58a6ff;font-size:14px;font-weight:600;padding:6px 0">
      识别 → <span id="profile-preview-res"></span>
    </div>
    <div class="btn-row">
      <button onclick="closeProfileModal()">取消</button>
      <button class="primary" id="btn-confirm-profile" onclick="confirmAddProfile()" disabled>添加</button>
    </div>
  </div>
</div>



<script src="js/defaults.js?v=3eb739e4"></script>
<script src="js/state.js?v=d10b1ca8"></script>
<script src="js/render.js?v=361aff1a"></script>
<script src="js/events.js?v=c12a690c"></script>
<script src="js/phone.js?v=151121d4"></script>
<script src="js/modal.js?v=b59bdf9a"></script>
<script src="js/shortcuts.js?v=4f04e0e0"></script>
<script src="js/replay.js?v=55b71af6"></script>
<script src="js/favorites.js?v=92c77e06"></script>
<script src="js/export.js?v=f3c675f1"></script>
<script src="js/live.js?v=26c970fe"></script>
<script src="js/resizer.js?v=1427e858"></script>
<script>
document.getElementById('cmd-get-device').onclick = function() {
  navigator.clipboard.writeText("adb shell 'echo \"$(getprop ro.product.model) $(wm size)\"'");
};
</script>
</body>
</html>
